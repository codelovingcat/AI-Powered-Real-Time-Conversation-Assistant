name: browser-e2e

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: conversa_e2e
          POSTGRES_USER: conversa
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conversa -d conversa_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ASPNETCORE_URLS: http://0.0.0.0:5080
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=conversa_e2e;Username=conversa;Password=test-password
      Authentication__Issuer: Conversa.E2E
      Authentication__Audience: Conversa.E2E
      Cors__AllowedOrigins: http://127.0.0.1:5173
      Authentication__AccessTokenLifetimeMinutes: "15"
      Authentication__SessionLifetimeDays: "1"
      Observability__Enabled: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create ephemeral E2E signing key
        shell: bash
        run: |
          key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$key"
          echo "Authentication__SigningKey=$key" >> "$GITHUB_ENV"
          echo "E2E_AUTH_SIGNING_KEY=$key" >> "$GITHUB_ENV"

      - name: Restore backend
        run: dotnet restore Conversa.slnx

      - name: Build backend
        run: dotnet build Conversa.slnx --no-restore --configuration Release

      - name: Install EF Core CLI
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Prepare E2E database
        shell: bash
        run: |
          dotnet ef database update             --project src/Conversa.Infrastructure/Conversa.Infrastructure.csproj             --startup-project src/Conversa.Api/Conversa.Api.csproj             --configuration Release

      - name: Start API
        shell: bash
        run: |
          nohup dotnet run             --project src/Conversa.Api/Conversa.Api.csproj             --configuration Release             --no-build             --no-restore             --no-launch-profile             > "$RUNNER_TEMP/conversa-api.log" 2>&1 &

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/health > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          cat "$RUNNER_TEMP/conversa-api.log"
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conversa-api-log
          path: ${{ runner.temp }}/conversa-api.log
          if-no-files-found: ignore
